<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="근무시간">
  <meta name="robots" content="noindex">
  <title>근무시간</title>
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><h1 id="title">오늘</h1></header>
  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="today" class="active"><span class="ic">◷</span>오늘</button>
    <button data-tab="plan"><span class="ic">✦</span>계획</button>
    <button data-tab="log"><span class="ic">☰</span>기록</button>
    <button data-tab="settings"><span class="ic">⚙</span>설정</button>
  </nav>

  <div id="sheet" class="sheet hidden" aria-modal="true" role="dialog">
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
